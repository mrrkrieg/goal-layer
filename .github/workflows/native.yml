name: Native build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record actual toolchain
        run: |
          sw_vers
          xcrun swift --version
          xcrun --show-sdk-version
      - name: Check geometry
        run: ./scripts/test.sh
      - name: Check synthetic focus analyzer
        run: python3 scripts/analyze-focus-check.py --self-test
      - name: Build development bundle
        run: ./scripts/build-app.sh
